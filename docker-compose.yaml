
services:
  scheduler:
    build:
      context: .
      dockerfile: ./docker/scheduler.Dockerfile
    volumes:
      - ./logs/:/app/logs/
      - ./start.sh:/app/start.sh
    ports:
      - 8080:8080
    env_file: "./.env"
    environment:
      - LEADER=true
      - SETUP=${SETUP}
      - LOGPATH=${LOGPATH}
    command: ["/app/start.sh"]
    depends_on:
      - generator
  follower:
    build:
      context: .
      dockerfile: ./docker/scheduler.Dockerfile
    volumes:
      - ./logs/:/app/logs/
      - ./start.sh:/app/start.sh
    env_file: "./.env"
    environment:
      - SETUP=${SETUP}
      - LOGPATH=${LOGPATH}
    command: ["/app/start.sh"]
    depends_on:
      - scheduler
  worker:
    build:
      context: .
      dockerfile: ./docker/worker.Dockerfile
    volumes:
      - ./logs/:/app/logs
      - ./start.sh:/app/start.sh
    env_file: "./.env"
    environment:
      - LOGPATH=${LOGPATH}
    command: ["/app/start.sh"]
    depends_on:
      - follower
  generator:
    build:
      context: .
      dockerfile: ./docker/taskgenerator.Dockerfile
    env_file: "./.env"
    environment:
      - LOGPATH=${LOGPATH}
    volumes:
      - ./logs/:/app/logs
      - ./start.sh:/app/start.sh
    command: ["/app/start.sh"]
