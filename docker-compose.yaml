
services:
  scheduler:
    build:
      context: .
      dockerfile: ./docker/scheduler.Dockerfile
    volumes:
      - ./logs/:/app/logs/
    ports:
      - 8080:8080
    env_file: "./config"
    environment:
      LEADER: "true"
    depends_on:
      - generator
  follower:
    build:
      context: .
      dockerfile: ./docker/scheduler.Dockerfile
    volumes:
      - ./logs/:/app/logs/
    env_file: "./config"
    environment:
      LEADER: ""
    depends_on:
      - scheduler
  worker:
    build:
      context: .
      dockerfile: ./docker/worker.Dockerfile
    volumes:
      - ./logs/:/app/logs
    env_file: "./config"
    depends_on:
      - scheduler
  generator:
    build:
      context: .
      dockerfile: ./docker/taskgenerator.Dockerfile
    env_file: "./config"
    volumes:
      - ./logs/:/app/logs
